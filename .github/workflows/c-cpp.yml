name: Android NDK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: ndk-build
      run: |
        $ANDROID_NDK_HOME/ndk-build \
          NDK_PROJECT_PATH=. \
          APP_BUILD_SCRIPT=Android.mk \
          NDK_APPLICATION_MK=Application.mk
    - uses: actions/upload-artifact@v4
      with:
        name: libs
        path: libs/
