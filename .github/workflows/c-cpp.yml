name: Android NDK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Copy dobby.h into expected folder
        run: |
          mkdir -p IL2CppSDKGenerator/Dobby
          cp dobby.h IL2CppSDKGenerator/Dobby/dobby.h

      - name: Find where IL2CPP macros are defined
        run: |
          echo "--- IL2CPP_DOMAIN_GET definitions/uses ---"
          grep -rn "IL2CPP_DOMAIN_GET\b" . || echo "NOT FOUND ANYWHERE"
          echo "--- All header files ---"
          find . -name "*.h" -not -path "./.git/*"

      - name: ndk-build
        run: |
          $ANDROID_NDK_HOME/ndk-build \
          NDK_PROJECT_PATH=. \
          APP_BUILD_SCRIPT=Android.mk \
          NDK_APPLICATION_MK=Application.mk

      - uses: actions/upload-artifact@v4
        with:
          name: libs
          path: libs/
